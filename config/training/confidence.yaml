ckpt: './checkpoints/Feb16-03:34:59_200.pth' # './checkpoints/Feb12-14:18:48_5.pth'

data:
  data: ncaa
  train_path: './data/train_data_128.pth'
  test_path: './data/test_data_128.pth'
  code_to_idx: './data/code_to_idx.pth'
  use_ncaa_splits: False
  type:

train:
  name: confidence
  batch_size: 2
  num_epochs: 2000
  lr: 2.0e-4
  weight_decay: 0.0
  grad_norm: 1.0
  lr_schedule: False
  lr_decay: 0.999
  ema: 0.999
  print_interval: 1
  save_interval: 10
  loss_type: vf

model:
  name: af3
  s_in: 19
  z_in: 6
  s_dim: 128
  z_dim: 64
  out_dim: 50
  n_pf_layers: 6
  n_atom_layers: 1
  embed_mask: True
  embed_aa: False
  reset_backbone: False
  random_augment: True

sample:
  n_samples: 1
  num_timesteps: 10

